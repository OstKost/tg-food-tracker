[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tg-food-tracker"
version = "0.1.0"
description = "Personal Telegram food diary backed by Google Sheets"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiogram>=3.31,<4",
  "google-api-python-client>=2.185,<3",
  "google-auth>=2.40,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
]

[project.scripts]
food-tracker = "food_tracker.main:main"
food-tracker-setup = "food_tracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/food_tracker"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["food_tracker"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

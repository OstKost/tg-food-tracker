services:
  bot:
    build: .
    image: tg-food-tracker:latest
    container_name: tg-food-tracker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account.json
    volumes:
      - type: bind
        source: ./secrets/google-service-account.json
        target: /run/secrets/google-service-account.json
        read_only: true
    init: true
    stop_grace_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1280"

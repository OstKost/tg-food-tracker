name: CI / CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality & Build Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
      - name: Run tests with race detector
        run: go test -race -v ./...
      - name: Validate Docker build
        run: docker build -t tg-food-tracker:test .

  deploy:
    name: Deploy to VPS
    needs: quality
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS over SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST || '109.107.176.224' }}
          VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER || 'root' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "${VPS_SSH_KEY:-}" ]]; then
            echo "ERROR: Neither VPS_SSH_KEY nor DEPLOY_SSH_KEY is set in GitHub repository secrets/environment." >&2
            echo "Please configure VPS_SSH_KEY in repository secrets (or environment 'production')." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [[ -n "${VPS_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          target="${VPS_USER}@${VPS_HOST}"
          remote_dir="/opt/tg-food-tracker"

          echo "Verifying VPS connectivity to $VPS_HOST..."
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "$target" "echo 'Connected to $VPS_HOST successfully'"

          echo "Synchronizing project files to $remote_dir on $VPS_HOST..."
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$target" "mkdir -p '$remote_dir/secrets'"
          git archive --format=tar.gz HEAD | ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$target" "
            set -euo pipefail
            mkdir -p '$remote_dir/.incoming'
            tar -xzf - -C '$remote_dir/.incoming'
            rm -rf '$remote_dir/src' '$remote_dir/tests'
            cp -r '$remote_dir/.incoming/'* '$remote_dir/'
            rm -rf '$remote_dir/.incoming'
          "

          echo "Running remote deployment script..."
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$target" "
            set -euo pipefail
            cd '$remote_dir'
            chmod +x deploy/deploy.sh
            ./deploy/deploy.sh
          "
